name: Publish skill package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r cyber-resume-reviewer/scripts/report-requirements.txt jsonschema

      - name: Validate skill behavior
        run: bash cyber-resume-reviewer/tests/smoke-test.sh

      - name: Build clean archives
        run: >-
          python .github/scripts/package_skill.py cyber-resume-reviewer
          --output dist/cyber-resume-reviewer.skill
          --wrapped-output dist/cyber-resume-reviewer-claude.zip

      - name: Record checksums
        run: sha256sum dist/* > dist/SHA256SUMS

      - name: Keep a manual-run artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cyber-resume-reviewer-packages
          path: dist/
          if-no-files-found: error

      - name: Publish tag assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
